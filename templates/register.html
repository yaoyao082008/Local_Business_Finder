{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block body %}
<div class="flex justify-center items-center min-h-screen bg-[#0f1624] text-white">
  <div class="bg-[#121a26] p-8 rounded-2xl shadow-lg w-96 border border-[#1c2636] relative">
    <h2 class="text-2xl font-bold text-center mb-6">Create Account</h2>

    <!-- Server-rendered error popup (same style as main page) -->
    {% if error %}
    <div id="errorPopup"
         class="fixed top-6 right-6 bg-red-600 text-white text-sm px-5 py-3 rounded-lg shadow-lg transform transition-all duration-500 opacity-0 z-[9999]">
      {{ message }}
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const popup = document.getElementById("errorPopup");
        if (popup) {
          // show popup and leave it visible until user navigates/changes form
          popup.classList.remove("opacity-0");
        }
      });
    </script>
    {% endif %}

    <form id="registerForm" class="space-y-4" action="/register" method="post">
      <img src="data:image/jpeg;base64, {{ captcha.img }}" alt="captcha" class="simple-captcha-img"/>
      <div>
        <label class="block mb-1 text-sm font-medium">Enter CAPTCHA</label>
        <input type="text"
               class="w-full px-3 py-2 bg-[#0f1624] border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#7b6ef6]"
               id="captcha-text" name="captcha-text"
               value="{{ request.form.get('captcha-text','') }}"
        >
        <input type="hidden" id="captcha-hash" name="captcha-hash" value="{{ captcha.hash }}">
      </div>

      <!-- Username -->
      <div>
        <label class="block mb-1 text-sm font-medium">Username</label>
        <input
          name="username"
          type="text"
          value="{{ prev_username if prev_username else '' }}"
          class="w-full px-3 py-2 bg-[#0f1624] border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#7b6ef6]"
          required
        />
      </div>

      <!-- Password -->
      <div>
        <label class="block mb-1 text-sm font-medium">Password</label>
        <input
          name="password"
          type="password"
          class="w-full px-3 py-2 bg-[#0f1624] border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#7b6ef6]"
          required
        />
      </div>

      <!-- Confirm Password -->
      <div>
        <label class="block mb-1 text-sm font-medium">Confirm Password</label>
        <input
          name="confirmPassword"
          type="password"
          class="w-full px-3 py-2 bg-[#0f1624] border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#7b6ef6]"
          required
        />
      </div>

      <!-- Client-side fallback error popup for password mismatch (keeps UX snappy) -->
      <div
        id="clientError"
        class="hidden absolute top-4 left-1/2 transform -translate-x-1/2 bg-red-600 text-white text-sm px-4 py-2 rounded-lg shadow-lg animate-slide-down"
      >
        ⚠️ Passwords do not match.
      </div>

      <!-- Submit -->
      <button
        type="submit"
        class="w-full bg-[#7b6ef6] hover:bg-[#6759d9] text-white font-semibold py-2 rounded-lg transition"
      >
        Register
      </button>
    </form>
  </div>
</div>

<!-- Tailwind animation for smooth popup -->
<style>
  @keyframes slideDown {
    from {
      opacity: 0;
      transform: translate(-50%, -10px);
    }
    to {
      opacity: 1;
      transform: translate(-50%, 0);
    }
  }
  .animate-slide-down {
    animation: slideDown 0.3s ease-out;
  }
</style>

<!-- Client-side validation (optional — server enforces everything) -->
<script>
  const form = document.getElementById("registerForm");
  const clientError = document.getElementById("clientError");

  form.addEventListener("submit", function (e) {
    const password = form.password.value.trim();
    const confirmPassword = form.confirmPassword.value.trim();

    if (password !== confirmPassword) {
      e.preventDefault();
      clientError.classList.remove("hidden");
      setTimeout(() => clientError.classList.add("hidden"), 3000);
      return;
    }
    // CAPTCHA front-end check optional; server will verify on submit
  });
</script>
{% endblock %}
